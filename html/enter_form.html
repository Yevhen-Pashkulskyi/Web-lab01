<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вхід - Мій Київстар</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Головна навігація -->
<header class="main-header">

</header>

<!-- === ОСНОВНИЙ КОНТЕНТ (ФОРМА ВХОДУ) === -->
<main class="container page-content">

  <div class="auth-card">
    <h1 class="auth-title">Вхід</h1>

    <!-- КРОК 1: Введення телефону -->
    <div id="step-1">
      <p class="auth-subtitle">Введіть номер телефону або особовий рахунок</p>
      <form id="formStep1">
        <div class="input-wrapper">
          <input type="text" id="phoneInput" placeholder="Номер телефону або особовий рахунок" autocomplete="off">
        </div>
        <button type="submit" id="nextBtn" class="btn-primary" disabled>Далі</button>
      </form>
    </div>

    <!-- КРОК 2: Пароль і Таймер (Прихований) -->
    <div id="step-2" style="display: none;">
      <p class="auth-subtitle">
        Введіть пароль, який надійшов в SMS на номер <b id="userPhoneDisplay"></b>
      </p>

      <form id="formStep2">
        <div class="input-wrapper password-wrapper">
          <input type="password" id="passwordInput" placeholder="Пароль">
          <button type="button" id="togglePass" class="eye-btn">👁️</button>
        </div>

        <div class="timer-box">
          Надіслати код повторно через <span id="timer">03:00</span>
        </div>

        <button type="submit" id="loginBtn" class="btn-primary" disabled>Увійти</button>
      </form>

      <button type="button" id="backBtn" class="btn-link">Змінити номер</button>
    </div>

  </div>

</main>

<!-- Підключаємо скрипт -->
<script src="js/script.js"></script>

</body>
</html>
